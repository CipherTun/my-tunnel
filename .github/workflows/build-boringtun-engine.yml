name: Build BoringTun Android Engine

on:
  workflow_dispatch:
  push:
    branches:
      - test/download-xray-vpn-1
    paths:
      - ".github/workflows/build-boringtun-engine.yml"

permissions:
  contents: read

jobs:
  build:
    name: BoringTun ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            linker: armv7a-linux-androideabi24-clang
          - abi: arm64-v8a
            target: aarch64-linux-android
            linker: aarch64-linux-android24-clang

    steps:
      - name: Checkout XRay Vpn
        uses: actions/checkout@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Create isolated BoringTun build project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p boringtun-probe/src
          cat > boringtun-probe/Cargo.toml <<'EOF'
          [package]
          name = "boringtun_android_probe"
          version = "0.1.0"
          edition = "2021"

          [lib]
          path = "src/lib.rs"

          [dependencies]
          boringtun = { version = "=0.7.1", default-features = false }
          EOF

          cat > boringtun-probe/src/lib.rs <<'EOF'
          //! Build-validation wrapper for the BoringTun dependency.
          //! This is not yet an application-ready VPN adapter.
          pub const ENGINE_NAME: &str = "BoringTun";
          EOF

      - name: Configure Android native linker
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/${{ matrix.linker }}"

          TARGET_KEY="$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')"
          echo "CARGO_TARGET_${TARGET_KEY}_LINKER=$BIN/${{ matrix.linker }}" >> "$GITHUB_ENV"

          case "${{ matrix.target }}" in
            armv7-linux-androideabi)
              echo "CC_armv7_linux_androideabi=$BIN/${{ matrix.linker }}" >> "$GITHUB_ENV"
              ;;
            aarch64-linux-android)
              echo "CC_aarch64_linux_android=$BIN/${{ matrix.linker }}" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Resolve dependency lockfile
        working-directory: boringtun-probe
        run: |
          set -euo pipefail
          cargo generate-lockfile
          test -s Cargo.lock

      - name: Compile BoringTun for Android
        working-directory: boringtun-probe
        run: |
          set -euo pipefail
          cargo build --locked --release --lib \
            --target "${{ matrix.target }}"

      - name: Verify BoringTun library artifact
        working-directory: boringtun-probe
        shell: bash
        run: |
          set -euo pipefail

          LIB="$(find "target/${{ matrix.target }}/release/deps" \
            -maxdepth 1 -type f \
            -name 'libboringtun-*.rlib' -print -quit)"

          if [ -z "$LIB" ] || [ ! -s "$LIB" ]; then
            echo "STOP: BoringTun Rust library artifact was not produced."
            exit 1
          fi

          mkdir -p "../boringtun-artifacts/${{ matrix.abi }}"
          cp "$LIB" "../boringtun-artifacts/${{ matrix.abi }}/"
          cp "$HOME/.cargo/registry/src/"*"/boringtun-0.7.1/LICENSE.md" \
            "../boringtun-artifacts/${{ matrix.abi }}/LICENSE.md" 2>/dev/null || true

          printf 'ABI: %s\nRust target: %s\nArtifact: %s\n' \
            "${{ matrix.abi }}" "${{ matrix.target }}" "$LIB" \
            > "../boringtun-artifacts/${{ matrix.abi }}/BUILD-INFO.txt"

          ls -lh "../boringtun-artifacts/${{ matrix.abi }}/"

      - name: Upload BoringTun artifact
        uses: actions/upload-artifact@v4
        with:
          name: boringtun-${{ matrix.abi }}
          path: boringtun-artifacts/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 14
