name: Build Official DNSTT Engine

on:
  workflow_dispatch:
  push:
    branches:
      - test/download-xray-vpn-1
    paths:
      - .github/workflows/build-dnstt-engine.yml

permissions:
  contents: read

jobs:
  build-dnstt:
    name: Build DNSTT for Android ARM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Checkout official DNSTT source
        run: |
          set -eux
          git clone https://www.bamsoftware.com/git/dnstt.git dnstt
          cd dnstt
          git log -1 --format='%H %s'
          test -s go.mod
          test -s dnstt-client/main.go

      - name: Build Android ARMv7 and ARM64 clients
        working-directory: dnstt
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/dnstt-artifacts"

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/armv7a-linux-androideabi24-clang"
          test -x "$TOOLCHAIN/aarch64-linux-android24-clang"

          GOOS=android GOARCH=arm GOARM=7 CGO_ENABLED=1 \
            CC="$TOOLCHAIN/armv7a-linux-androideabi24-clang" \
            go build -trimpath -ldflags="-s -w" \
            -o "$RUNNER_TEMP/dnstt-artifacts/dnstt-client-android-armeabi-v7a" \
            ./dnstt-client

          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            CC="$TOOLCHAIN/aarch64-linux-android24-clang" \
            go build -trimpath -ldflags="-s -w" \
            -o "$RUNNER_TEMP/dnstt-artifacts/dnstt-client-android-arm64-v8a" \
            ./dnstt-client

          file "$RUNNER_TEMP/dnstt-artifacts/"*
          test -s "$RUNNER_TEMP/dnstt-artifacts/dnstt-client-android-armeabi-v7a"
          test -s "$RUNNER_TEMP/dnstt-artifacts/dnstt-client-android-arm64-v8a"

      - name: Record source and build metadata
        working-directory: dnstt
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/dnstt-artifacts/source-commit.txt"
          go version > "$RUNNER_TEMP/dnstt-artifacts/go-version.txt"

      - name: Upload DNSTT build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: official-dnstt-android-arm
          path: ${{ runner.temp }}/dnstt-artifacts/
          if-no-files-found: error
          retention-days: 14
