name: Build Slipstream Android Engine

on:
  workflow_dispatch:
  push:
    branches:
      - test/download-xray-vpn-1
    paths:
      - ".github/workflows/build-slipstream-engine.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            linker: armv7a-linux-androideabi24-clang
          - abi: arm64-v8a
            target: aarch64-linux-android
            linker: aarch64-linux-android24-clang

    steps:
      - uses: actions/checkout@v4

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Checkout Slipstream Rust source
        uses: actions/checkout@v4
        with:
          repository: Mygod/slipstream-rust
          ref: main
          path: slipstream-rust
          submodules: recursive

      - name: Expose vendored OpenSSL to Picoquic CMake
        working-directory: slipstream-rust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path

          path = Path("crates/slipstream-ffi/Cargo.toml")
          content = path.read_text()
          old = '[build-dependencies]\ncc = "1.0"\n'
          new = (
              '[build-dependencies]\n'
              'cc = "1.0"\n'
              'openssl-sys = { version = "0.9", features = ["vendored"] }\n'
          )

          if content.count(old) != 1:
              raise SystemExit(
                  "STOP: Upstream Cargo.toml build-dependencies block "
                  "did not match exactly once."
              )

          path.write_text(content.replace(old, new, 1))
          print("Added vendored openssl-sys build dependency.")
          PY_PATCH

          grep -n -A4 '^\[build-dependencies\]' crates/slipstream-ffi/Cargo.toml

          # Patch Picoquic's CMake invocation to pass the actual vendored
          # OpenSSL library paths discovered by the Rust build script.
          python3 - <<'PY_PICOQUIC'
          from pathlib import Path

          path = Path("crates/slipstream-ffi/build/picoquic.rs")
          source = path.read_text()

          function_anchor = "pub(crate) fn build_picoquic("
          helper = r'''
          fn find_library_file(root: &Path, file_name: &str, depth: u8) -> Option<PathBuf> {
              if depth > 8 {
                  return None;
              }

              for entry in std::fs::read_dir(root).ok()?.flatten() {
                  let path = entry.path();

                  if path.is_file()
                      && path.file_name().and_then(|name| name.to_str()) == Some(file_name)
                  {
                      return Some(path);
                  }

                  if path.is_dir() {
                      if let Some(found) = find_library_file(&path, file_name, depth + 1) {
                          return Some(found);
                      }
                  }
              }

              None
          }

          '''

          old = (
              '    if let Some(root) = &openssl_paths.root {\n'
              '        command.env("OPENSSL_ROOT_DIR", root);\n'
              '    }\n'
          )

          new = (
              '    if let Some(root) = &openssl_paths.root {\n'
              '        command.env("OPENSSL_ROOT_DIR", root);\n'
              '\n'
              '        for (env_name, file_name) in [\n'
              '            ("OPENSSL_CRYPTO_LIBRARY", "libcrypto.a"),\n'
              '            ("OPENSSL_SSL_LIBRARY", "libssl.a"),\n'
              '        ] {\n'
              '            if env::var_os(env_name).is_none() {\n'
              '                match find_library_file(root, file_name, 0) {\n'
              '                    Some(library) => {\n'
              '                        println!(\n'
              '                            "cargo:warning=Using {}={}",\n'
              '                            env_name,\n'
              '                            library.display()\n'
              '                        );\n'
              '                        command.env(env_name, library);\n'
              '                    }\n'
              '                    None => {\n'
              '                        println!(\n'
              '                            "cargo:warning=Could not find {} under {}",\n'
              '                            file_name,\n'
              '                            root.display()\n'
              '                        );\n'
              '                    }\n'
              '                }\n'
              '            }\n'
              '        }\n'
              '    }\n'
          )

          if source.count(function_anchor) != 1:
              raise SystemExit("STOP: build_picoquic function anchor did not match exactly once.")

          if source.count(old) != 1:
              raise SystemExit("STOP: OPENSSL_ROOT_DIR block did not match exactly once.")

          if "fn find_library_file(" in source:
              raise SystemExit("STOP: Library discovery helper already exists; inspect source first.")

          source = source.replace(function_anchor, helper + function_anchor, 1)
          source = source.replace(old, new, 1)
          path.write_text(source)
          print("Patched Picoquic to locate and pass libcrypto.a and libssl.a.")
          PY_PICOQUIC

          cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Configure Android linker
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -f "$NDK/build/cmake/android.toolchain.cmake"

          # Pass the exact NDK and ABI to Picoquic's CMake build.
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_ABI=${{ matrix.abi }}" >> "$GITHUB_ENV"
          echo "ANDROID_PLATFORM=android-24" >> "$GITHUB_ENV"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # slipstream-ffi/build/cc.rs explicitly reads these variables
          # for Android C objects; Cargo's target-specific CC_* is not enough.
          echo "RUST_ANDROID_GRADLE_CC=$TOOLCHAIN/${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "RUST_ANDROID_GRADLE_AR=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"

          test -x "$TOOLCHAIN/${{ matrix.linker }}"
          test -x "$TOOLCHAIN/llvm-ar"
          test -x "$TOOLCHAIN/llvm-ranlib"

          # Vendored OpenSSL may call target-prefixed binutils.
          ln -sf "$TOOLCHAIN/llvm-ar" "$TOOLCHAIN/arm-linux-androideabi-ar"
          ln -sf "$TOOLCHAIN/llvm-ranlib" "$TOOLCHAIN/arm-linux-androideabi-ranlib"
          ln -sf "$TOOLCHAIN/llvm-ar" "$TOOLCHAIN/aarch64-linux-android-ar"
          ln -sf "$TOOLCHAIN/llvm-ranlib" "$TOOLCHAIN/aarch64-linux-android-ranlib"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')_LINKER=$TOOLCHAIN/${{ matrix.linker }}" >> "$GITHUB_ENV"
          case "${{ matrix.target }}" in
            armv7-linux-androideabi)
              echo "CC_armv7_linux_androideabi=$TOOLCHAIN/${{ matrix.linker }}" >> "$GITHUB_ENV"
              echo "AR_armv7_linux_androideabi=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
              echo "RANLIB_armv7_linux_androideabi=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"
              ;;
            aarch64-linux-android)
              echo "CC_aarch64_linux_android=$TOOLCHAIN/${{ matrix.linker }}" >> "$GITHUB_ENV"
              echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
              echo "RANLIB_aarch64_linux_android=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Verify upstream package
        working-directory: slipstream-rust
        run: |
          set -euo pipefail
          test -s Cargo.toml
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo package --list --package slipstream-client --allow-dirty > /dev/null

      - name: Build client
        working-directory: slipstream-rust
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --package slipstream-client \
            --features "openssl-vendored,picoquic-minimal-build" \
            --target "${{ matrix.target }}"

      - name: Verify and stage binary
        working-directory: slipstream-rust
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/slipstream-client"
          test -s "$BIN"
          file "$BIN"
          llvm-readelf -h "$BIN"
          mkdir -p "../slipstream-artifacts/${{ matrix.abi }}"
          cp "$BIN" "../slipstream-artifacts/${{ matrix.abi }}/slipstream-client"
          chmod 755 "../slipstream-artifacts/${{ matrix.abi }}/slipstream-client"

      - uses: actions/upload-artifact@v4
        with:
          name: slipstream-client-${{ matrix.abi }}
          path: slipstream-artifacts/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 14
