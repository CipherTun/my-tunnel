name: Build XRay Vpn

on:
  push:
    branches:
      - test/xray-vpn-zip-as-is
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned to a minor so a new Flutter/AGP release cannot silently break the build.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Generate Android project (package xyz.xray.vpn)
        run: |
          flutter --version
          flutter create --platforms=android --org xyz.xray --project-name vpn .
          rm -rf test

      - name: Patch Android project
        run: python3 tools/patch_android.py

      - name: Dependencies
        run: flutter pub get

      # Compile errors surface here in seconds instead of after a long Gradle build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Sign split APKs
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/app-*-release.apk)

          if [ "${#APKS[@]}" -ne 3 ]; then
            echo "::error::Expected three ABI-split release APKs; found ${#APKS[@]}."
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi

          for IN in "${APKS[@]}"; do
            OUT="dist/XRayVpn-${IN##*/app-}"
            if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
              echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
              ARGS=(sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD)
              if [ -n "$KEY_PASSWORD" ]; then ARGS+=(--key-pass env:KEY_PASSWORD); fi
              "$BT/apksigner" "${ARGS[@]}" --out "$OUT" "$IN"
              "$BT/apksigner" verify "$OUT"
              rm -f "$RUNNER_TEMP/release.p12"
            else
              echo "::warning::Signing secrets are incomplete; copying the build-produced APK without release-key signing."
              cp "$IN" "$OUT"
            fi
            echo "Prepared: $OUT"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: XRayVpn-split-apks
          path: dist/*.apk
          if-no-files-found: error
