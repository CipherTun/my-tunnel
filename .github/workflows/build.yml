name: Build XRay Vpn - ZIP A feature variant

on:
  push:
    branches:
      - test/xray-vpn-zip-a-features
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org xyz.xray --project-name vpn .
          rm -f test/widget_test.dart

      - name: Patch Android project
        run: python3 tools/patch_android.py

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build ABI-split APKs
        run: flutter build apk --release --split-per-abi

      - name: Sign and verify ABI APKs
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/app-*-release.apk)
          if [ "${#APKS[@]}" -ne 3 ]; then
            echo "::error::Expected 3 ABI APKs; found ${#APKS[@]}"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          for IN in "${APKS[@]}"; do
            OUT="dist/XRayVpn-ZIPA-${IN##*/app-}"
            if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
              echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
              ARGS=(sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD)
              if [ -n "$KEY_PASSWORD" ]; then ARGS+=(--key-pass env:KEY_PASSWORD); fi
              "$BT/apksigner" "${ARGS[@]}" --out "$OUT" "$IN"
              "$BT/apksigner" verify "$OUT"
              rm -f "$RUNNER_TEMP/release.p12"
            else
              echo "::warning::Signing secrets are incomplete; retaining the build-produced APK signature."
              cp "$IN" "$OUT"
            fi
            "$BT/aapt" dump badging "$OUT" | grep -Fq "package: name='xyz.xray.vpn'"
            echo "Verified package id: $OUT"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: XRayVpn-ZIPA-split-apks
          path: dist/*.apk
          if-no-files-found: error
