name: XRay Vpn Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-vpn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Toolchain versions
        run: |
          flutter --version
          dart --version
          java -version
      # xyz.xray + project name vpn generates namespace/applicationId xyz.xray.vpn.
      - name: Generate Android host project
        run: flutter create --platforms=android --org xyz.xray --project-name vpn .

      - name: Remove generated placeholder test and lint config
        run: |
          rm -f test/widget_test.dart analysis_options.yaml
          test -s test/core_regression_test.dart
      - name: Configure Android VPN host
        run: python3 tools/patch_android.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify and deduplicate identical Go mobile runtime
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import io
          import os
          import zipfile

          root = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache"))
          )
          def locate(name):
              matches = [
                  p for p in root.glob(f"hosted/pub.dev/**/android/**/{name}")
                  if p.is_file()
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"ERROR: Expected exactly one {name} in pub cache; "
                      f"found {len(matches)}. No AAR was modified."
                  )
              return matches[0]

          box = locate("libbox.aar")
          v2ray = locate("libv2ray.aar")

          def runtime(aar):
              with zipfile.ZipFile(aar) as z:
                  if "classes.jar" not in z.namelist():
                      raise SystemExit(f"ERROR: classes.jar missing in {aar}")
                  inner = zipfile.ZipFile(io.BytesIO(z.read("classes.jar")))
                  data = {
                      n: hashlib.sha256(inner.read(n)).hexdigest()
                      for n in inner.namelist()
                      if n.startswith("go/") and n.endswith(".class")
                  }
                  inner.close()
                  return data

          a = runtime(box)
          b = runtime(v2ray)
          if not a or set(a) != set(b) or a != b:
              raise SystemExit(
                  "ERROR: Go runtime classes are absent or differ between "
                  "libbox.aar and libv2ray.aar. Refusing to strip either runtime. "
                  "Use a compatible dual-core integration instead."
              )

          with zipfile.ZipFile(box) as src:
              entries = [(info, src.read(info.filename))
                         for info in src.infolist()]

          updated_inner = io.BytesIO()
          with zipfile.ZipFile(updated_inner, "w") as dst:
              with zipfile.ZipFile(io.BytesIO(
                  next(data for info, data in entries
                       if info.filename == "classes.jar")
              )) as inner:
                  for info in inner.infolist():
                      if info.filename.startswith("go/") and info.filename.endswith(".class"):
                          continue
                      dst.writestr(info, inner.read(info.filename))

          tmp = box.with_suffix(".aar.tmp")
          with zipfile.ZipFile(tmp, "w") as dst:
              for info, data in entries:
                  if info.filename == "classes.jar":
                      data = updated_inner.getvalue()
                  dst.writestr(info, data)

          tmp.replace(box)
          print("Verified identical Go runtime classes.")
          print("Removed only the duplicate go/*.class entries from libbox.aar.")
          print("Kept sing-box's remaining Java classes and native libraries.")
          PYTHON
      - name: Analyze Dart source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build separate release APKs
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - name: Verify each split APK and package identity
        run: |
          set -eu
          OUT="build/app/outputs/flutter-apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          test -n "$AAPT" || { echo "ERROR: aapt not found"; exit 1; }

          verify_apk() {
            APK="$1"
            ABI="$2"
            test -s "$APK" || { echo "ERROR: Missing APK: $APK"; exit 1; }
            unzip -l "$APK" | grep -q "lib/$ABI/" || {
              echo "ERROR: $APK does not contain native libraries for $ABI"
              exit 1
            }
            "$AAPT" dump badging "$APK" | grep -F "package: name='xyz.xray.vpn'"
            "$AAPT" dump badging "$APK" | grep -F "application-label:'XRay Vpn'"
            echo "Verified: $APK ($ABI)"
          }

          verify_apk "$OUT/app-armeabi-v7a-release.apk" "armeabi-v7a"
          verify_apk "$OUT/app-arm64-v8a-release.apk" "arm64-v8a"
          verify_apk "$OUT/app-x86_64-release.apk" "x86_64"

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: xray-vpn-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: xray-vpn-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: xray-vpn-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14
