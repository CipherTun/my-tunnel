name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # Generate android/ (kept out of git) with the correct package: xyz.xray.vpn
      - run: flutter create --platforms=android --org xyz.xray --project-name vpn .
      - run: python3 tools/patch_android.py
      - run: flutter pub get
      # Only real errors fail the build; style hints are informational.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      # One universal APK: armeabi-v7a, arm64-v8a, x86_64
      - run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64
      - run: cp build/app/outputs/flutter-apk/app-release.apk xray-vpn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: xray-vpn-universal-apk
          path: xray-vpn.apk
