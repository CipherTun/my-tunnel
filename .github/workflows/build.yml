name: Build XRay Vpn

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned to a minor. 3.38 uses AGP 8, the toolchain flutter_v2ray_client and
      # openvpn_flutter are built against; newer Flutter lines move to AGP 9.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x
          cache: true

      - name: Generate Android project (package xyz.xray.vpn)
        run: |
          flutter --version
          flutter create --platforms=android --org xyz.xray --project-name vpn .
          rm -rf test

      - name: Patch Android project
        run: python3 tools/patch_android.py

      - name: Dependencies
        run: flutter pub get

      # Compile errors surface here in seconds instead of after a long Gradle build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Sign APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist
          IN=build/app/outputs/flutter-apk/app-release.apk
          OUT=dist/XRayVpn-release.apk
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            ARGS=(sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD)
            if [ -n "$KEY_PASSWORD" ]; then ARGS+=(--key-pass env:KEY_PASSWORD); fi
            "$BT/apksigner" "${ARGS[@]}" --out "$OUT" "$IN"
            "$BT/apksigner" verify --print-certs "$OUT" | head -3
            rm -f "$RUNNER_TEMP/release.p12"
          else
            echo "::warning::No signing secrets set. The APK is debug-signed with a throwaway key, so each build has a different signature and cannot update the previous install."
            cp "$IN" "$OUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: XRayVpn-apk
          path: dist/*.apk
          if-no-files-found: error
