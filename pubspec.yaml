name: vpn
description: XRay Vpn - LibXray, SSH, SlowDNS, Slipstream, OpenConnect, Psiphon, WireGuard and OpenVPN tunnel client.
publish_to: "none"
version: 2.4.0+10

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^2.9.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  openvpn_flutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
